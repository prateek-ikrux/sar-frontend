# Usage:
#   Dev  (hot reload): docker compose up --watch dev
#   Prod (static build): docker compose up --build prod
# Profiles keep a bare `docker compose up` from starting both at once.

services:
  prod:
    profiles: [prod]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the bundle at build time; read from .env or the shell
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    restart: unless-stopped


  dev:
    profiles: [dev]
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=development
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        - action: sync
          path: ./index.html
          target: /app/index.html
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./vite.config.ts
        - action: rebuild
          path: ./tsconfig.json
        - action: rebuild
          path: ./tsconfig.app.json
        - action: rebuild
          path: ./tsconfig.node.json
