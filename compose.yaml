# Usage:
#   Dev  (hot reload): docker compose up --watch dev
#   Prod (static build): docker compose up --build -d prod
# Profiles keep a bare `docker compose up` from starting both at once.

services:
  prod:
    profiles: [prod]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the bundle at build time; read from .env or the shell.
        # Defaults to same-origin /api/v1, which nginx proxies to the backend
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    init: true
    ports:
      # Loopback only: Docker's published ports bypass ufw, and nginx on the
      # host is the only thing that should reach this
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    # Docker's default json-file driver never rotates, so logs would grow until
    # the disk fills; keep at most 3 x 10 MB per container
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  dev:
    profiles: [dev]
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=development
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        - action: sync
          path: ./index.html
          target: /app/index.html
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./vite.config.ts
        - action: rebuild
          path: ./tsconfig.json
        - action: rebuild
          path: ./tsconfig.app.json
        - action: rebuild
          path: ./tsconfig.node.json
