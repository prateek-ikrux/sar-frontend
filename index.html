<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Search the ikrux resume library in plain language."
    />
    <title>Candidate Search &amp; Retrieval &middot; ikrux</title>
    <!-- Sets the theme before first paint, so a dark-mode visit never flashes
         white. Mirrors ThemeProvider, which takes over once React loads. -->
    <script>
      try {
        var saved = localStorage.getItem("vite-ui-theme")
        var dark =
          saved === "dark" ||
          (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.add(dark ? "dark" : "light")
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
